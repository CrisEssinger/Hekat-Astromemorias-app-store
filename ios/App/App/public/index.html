<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#BF8A10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://ciadoceu.com.br/wp-content/uploads/2026/05/logo_hekat.png.png" />
    <link rel="apple-touch-icon" href="https://ciadoceu.com.br/wp-content/uploads/2026/05/logo_hekat.png.png" />
    <title>Hekat Astromemorias</title>
    <script type="module" crossorigin src="/assets/index-Dg7sYZQv.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B3RYlWd3.css">
  </head>
  <body>
    <!-- DEBUG MARKER DO NOT REMOVE -->
    <div style="position:fixed;bottom:0;right:0;font-size:10px;color:rgba(0,0,0,0.1);z-index:99999;">Hekat-v2026-05-19</div>
    <div id="root"></div>
    <div id="mount-fallback" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:sans-serif;color:#64748b;display:none;">
      <p>Sincronizando Portal Hekat...</p>
      <p style="font-size:12px;opacity:0.7;">Se demorar demais, verifique sua conexão ou tente recarregar.</p>
    </div>
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          document.getElementById('mount-fallback').style.display = 'block';
        }
      }, 5000);
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // Ignorar erros benignos de desenvolvimento (WebSocket e Vite HMR)
        var msgStr = String(msg || "");
        var urlStr = String(url || "");
        if (msgStr.indexOf('WebSocket') !== -1 || msgStr.indexOf('websocket') !== -1 || urlStr.indexOf('vite') !== -1) {
          return;
        }

        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.padding = '20px';
        div.style.background = '#1E1B4B';
        div.style.color = '#FEE2E2';
        div.style.zIndex = '99999';
        div.style.overflow = 'auto';
        div.style.fontFamily = 'monospace';
        
        var stack = error && error.stack ? error.stack : '';
        div.innerHTML = '<h3 style="margin-top:0;color:#FCA5A5">Erro Crítico no Portal Hekat</h3>' +
                        '<p style="font-size:14.5px;font-weight:bold;margin:10px 0">Mensagem: ' + msg + '</p>' +
                        '<p style="font-size:12px;margin:5px 0">Arquivo: ' + url + '</p>' +
                        '<p style="font-size:12px;margin:5px 0">Definição: Linha ' + line + ', Coluna ' + col + '</p>' +
                        (stack ? '<pre style="font-size:11px;background:#0F172A;padding:12px;border-radius:8px;overflow-x:auto;color:#E2E8F0;border:1px solid #334155;margin-top:15px;line-height:1.5">' + stack + '</pre>' : '<p style="font-size:12px;color:#FDA4AF">Nenhum rastreamento de pilha (stack) disponível.</p>');
        document.body.appendChild(div);
      };

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason instanceof Error ? reason.message : String(reason);
        var stack = reason instanceof Error && reason.stack ? reason.stack : '';
        
        // Ignorar erros benignos de desenvolvimento (WebSocket e Vite HMR)
        var msgStr = String(msg || "");
        var stackStr = String(stack || "");
        if (msgStr.indexOf('WebSocket') !== -1 || msgStr.indexOf('websocket') !== -1 || stackStr.indexOf('vite') !== -1) {
          return;
        }

        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.padding = '20px';
        div.style.background = '#1D1D2C';
        div.style.color = '#FDE047';
        div.style.zIndex = '99999';
        div.style.overflow = 'auto';
        div.style.fontFamily = 'monospace';
        
        div.innerHTML = '<h3 style="margin-top:0;color:#FDE047">Promessa Não Tratada no Portal Hekat</h3>' +
                        '<p style="font-size:14.5px;font-weight:bold;margin:10px 0">Mensagem: ' + msg + '</p>' +
                        (stack ? '<pre style="font-size:11px;background:#0B0B14;padding:12px;border-radius:8px;overflow-x:auto;color:#E2E8F0;border:1px solid #44403C;margin-top:15px;line-height:1.5">' + stack + '</pre>' : '<p style="font-size:12px;color:#FEF08A">Nenhum rastreamento de pilha (stack) disponível para esta rejeição.</p>');
        document.body.appendChild(div);
      });
    </script>
  </body>
</html>
